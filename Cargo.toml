[package]
name = "vdb-rs"
version = "0.6.0"
edition = "2021"
# `examples/camera_controller.rs` is a shared module, not an example of its own.
autoexamples = false
authors = ["Traverse-Research <support@traverseresearch.nl>"]
description = "OpenVDB manipulation library."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Traverse-Research/vdb-rs"
repository = "https://github.com/Traverse-Research/vdb-rs"
keywords = ["voxel", "vdb"]
categories = ["rendering"]
include = ["src", "LICENSE"]
documentation = "https://docs.rs/vdb-rs"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"

[profile.dev.package.'*']
opt-level = 's'
debug = true

[dependencies]
bitflags = "2"
bitvec = "1"
blosc-src = { version = "0.3.0", features = ["lz4"] }
bytemuck = { version = "1.13", features = ["extern_crate_alloc"] }
byteorder = "1.4"
flate2 = "1"
glam = ">=0.19,<=0.33"
half = { version = "2.2.1", features = ["bytemuck"] }
log = "0.4"
thiserror = "1"

[dev-dependencies]
# `bevy-aabb-instancing` has no release supporting bevy 0.19 yet; track the branch that upgrades
# it (ForesightMiningSoftwareCorporation/bevy_aabb_instancing#27) until that lands and is
# published.  Dev-dependencies are stripped when publishing, so this does not leak to consumers.
bevy-aabb-instancing = { git = "https://github.com/MarijnS95/bevy_aabb_instancing", branch = "bevy-0.13" }
bevy_egui = "0.42"

[dev-dependencies.bevy]
version = "0.19"
default-features = false
features = ["bevy_pbr", "bevy_window", "bevy_winit", "x11", "tonemapping_luts"]

[[example]]
name = "bevy"
path = "examples/bevy.rs"

[[example]]
name = "slicer"
path = "examples/slicer.rs"
